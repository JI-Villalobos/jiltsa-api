server.port=${PORT}
spring.profiles.active=pdn
spring.config.import=optional:jwt.properties
# Sessions end at the service boundary (see @Transactional on services), not at the view
spring.jpa.open-in-view=false
# Load lazy associations/collections in batches instead of one select per parent row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Schema is owned by Flyway (db/migration); Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway was introduced are marked as V1 and get later migrations only
spring.flyway.baseline-on-migrate=true
