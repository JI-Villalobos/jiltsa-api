server.port=${PORT:8080}
spring.profiles.active=pdn
spring.config.import=optional:jwt.properties
# Sessions end at the service boundary (see @Transactional on services), not at the view
spring.jpa.open-in-view=false
# Load lazy associations/collections in batches instead of one select per parent row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Schema is owned by Flyway (db/migration); Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway was introduced are marked as V1 and get later migrations only
spring.flyway.baseline-on-migrate=true
# API docs: /v3/api-docs (JSON) and /swagger-ui.html. Paging parameters are documented
# by OpenApiConfig (page/elements/sortBy/sortDirection), not by springdoc's Pageable converter.
springdoc.model-converters.pageable-converter.enabled=false
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Let MySQL Connector/J turn JDBC batches (sales uploads) into multi-row INSERTs
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
