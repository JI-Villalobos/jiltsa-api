services:
  api:
    container_name: jiltsa
    build: .
    # Tag the image with the version in gradle.properties: JILTSA_VERSION=2.1.0 docker compose build
    image: jiltsa-api:${JILTSA_VERSION:-latest}
    restart: unless-stopped
    # Same variables run.sh uses: JLTS_DATASOURCE_*, JWT_KEY, PORT (optional, default 8080),
    # APP_STORAGE_BUCKET and S3 credentials (APP_STORAGE_ACCESS_KEY/SECRET_KEY or AWS_* vars)
    # Optional: JWT_EXPIRATION (e.g. 12h), APP_CORS_ALLOWED_ORIGINS (required in any real deployment,
    #   e.g. https://admin.example.com,https://caja.example.com)
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
